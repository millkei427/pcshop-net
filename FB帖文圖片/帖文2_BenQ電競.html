<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1200px; height:630px; overflow:hidden; font-family:'Noto Sans HK', sans-serif; }
.bg { width:100%; height:100%; background:linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 60%, #0a1a0a 100%); position:relative; overflow:hidden; }
.accent { position:absolute; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle, rgba(255,200,0,0.12) 0%, transparent 70%); top:-100px; right:0; }
.accent2 { position:absolute; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle, rgba(0,255,100,0.08) 0%, transparent 70%); bottom:0; left:100px; }
.content { position:relative; z-index:10; padding:40px 60px; height:100%; display:flex; flex-direction:column; justify-content:space-between; }
.header { display:flex; align-items:center; gap:16px; }
.logo-badge { background:linear-gradient(135deg, #ffc800, #ff6600); color:#000; font-weight:900; font-size:18px; padding:8px 18px; border-radius:8px; }
.cat-badge { background:rgba(255,200,0,0.15); border:1px solid rgba(255,200,0,0.5); color:#ffc800; font-size:14px; font-weight:700; padding:6px 16px; border-radius:20px; }
.main { display:flex; gap:50px; align-items:center; }
.text-side { flex:1; }
.headline { font-size:46px; font-weight:900; color:white; line-height:1.1; margin-bottom:10px; }
.headline span { color:#ffc800; }
.subtitle { color:rgba(255,255,255,0.6); font-size:16px; margin-bottom:24px; }
.models { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
.model-card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,200,0,0.3); border-radius:14px; padding:16px; text-align:center; }
.model-card.highlight { background:rgba(255,200,0,0.1); border-color:#ffc800; }
.model-hz { font-size:32px; font-weight:900; color:#ffc800; }
.model-name { font-size:11px; color:rgba(255,255,255,0.6); margin:4px 0; }
.model-price { font-size:16px; font-weight:700; color:white; }
.features { display:flex; gap:10px; margin-top:20px; }
.feat { background:rgba(255,200,0,0.1); border:1px solid rgba(255,200,0,0.3); color:#ffc800; font-size:12px; font-weight:700; padding:6px 12px; border-radius:20px; }
.visual { width:280px; display:flex; flex-direction:column; align-items:center; gap:12px; }
.monitor-icon { font-size:100px; }
.zowie-tag { background:rgba(255,200,0,0.15); border:1px solid rgba(255,200,0,0.5); color:#ffc800; font-size:18px; font-weight:900; padding:10px 24px; border-radius:10px; letter-spacing:3px; }
.footer { display:flex; justify-content:space-between; align-items:center; }
.contact { color:rgba(255,255,255,0.6); font-size:14px; line-height:1.9; }
.contact strong { color:#ffc800; }
.tags { color:rgba(255,200,0,0.4); font-size:12px; text-align:right; line-height:2; }
</style>
</head>
<body>
<div class="bg">
  <div class="accent"></div>
  <div class="accent2"></div>
  <div class="content">
    <div class="header">
      <div class="logo-badge">PC SHOP</div>
      <div class="cat-badge">🏆 電競顯示器</div>
    </div>
    <div class="main">
      <div class="text-side">
        <div class="headline">職業電競玩家<br>的選擇 — <span>BenQ ZOWIE</span></div>
        <div class="subtitle">想贏？螢幕係關鍵！FPS 電競專用系列</div>
        <div class="models">
          <div class="model-card">
            <div class="model-hz">280Hz</div>
            <div class="model-name">XL2546X+<br>24.1" FHD</div>
            <div class="model-price">HK$4,618</div>
          </div>
          <div class="model-card highlight">
            <div class="model-hz">400Hz</div>
            <div class="model-name">XL2566X+<br>24.1" FHD</div>
            <div class="model-price">HK$6,136</div>
          </div>
          <div class="model-card">
            <div class="model-hz">600Hz</div>
            <div class="model-name">XL2586X+<br>24.5" FHD</div>
            <div class="model-price">HK$10,437</div>
          </div>
        </div>
        <div class="features">
          <span class="feat">DyAc 2</span>
          <span class="feat">Fast TN</span>
          <span class="feat">1ms GTG</span>
          <span class="feat">職業選手同款</span>
        </div>
      </div>
      <div class="visual">
        <div class="monitor-icon">🖥️</div>
        <div class="zowie-tag">ZOWIE</div>
      </div>
    </div>
    <div class="footer">
      <div class="contact">
        <strong>🌐 pcshop-net.com</strong><br>
        📞 2840 3503　📍 澳門 PC Shop 專業電腦店
      </div>
      <div class="tags">
        #BenQ #ZOWIE #電競螢幕<br>#FPS #CS2 #澳門電競
      </div>
    </div>
  </div>
</div>
</body>
</html>
