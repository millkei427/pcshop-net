<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1200px; height:630px; overflow:hidden; font-family:'Noto Sans HK', sans-serif; }
.bg { width:100%; height:100%; background:linear-gradient(135deg, #050510 0%, #0a1628 50%, #020a20 100%); position:relative; overflow:hidden; }
.speed-lines { position:absolute; width:100%; height:100%; background:repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(0,120,255,0.03) 80px, rgba(0,120,255,0.03) 81px); }
.glow { position:absolute; width:600px; height:200px; background:radial-gradient(ellipse, rgba(0,120,255,0.15) 0%, transparent 70%); top:50%; right:-100px; transform:translateY(-50%); }
.content { position:relative; z-index:10; padding:40px 60px; height:100%; display:flex; flex-direction:column; justify-content:space-between; }
.header { display:flex; align-items:center; gap:16px; }
.logo-badge { background:linear-gradient(135deg, #0050c8, #00a8ff); color:white; font-weight:900; font-size:18px; padding:8px 18px; border-radius:8px; }
.cat-badge { background:rgba(0,168,255,0.15); border:1px solid rgba(0,168,255,0.4); color:#00a8ff; font-size:14px; font-weight:700; padding:6px 16px; border-radius:20px; }
.main { display:flex; gap:40px; align-items:center; }
.text-side { flex:1; }
.brand-row { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
.samsung-tag { color:#1428a0; background:#fff; font-weight:900; font-size:16px; padding:4px 14px; border-radius:6px; }
.gen5-tag { color:#00a8ff; font-size:14px; font-weight:700; background:rgba(0,168,255,0.15); padding:4px 12px; border-radius:6px; border:1px solid rgba(0,168,255,0.4); }
.headline { font-size:46px; font-weight:900; color:white; line-height:1.1; margin-bottom:10px; }
.headline span { color:#00a8ff; }
.subtitle { color:rgba(255,255,255,0.6); font-size:16px; margin-bottom:22px; }
.speed-bar { margin-bottom:20px; }
.speed-label { font-size:13px; color:rgba(255,255,255,0.5); margin-bottom:6px; }
.speed-value { display:flex; align-items:center; gap:14px; }
.speed-num { font-size:36px; font-weight:900; color:#00a8ff; }
.speed-unit { font-size:16px; color:rgba(255,255,255,0.5); }
.bar-track { height:8px; background:rgba(255,255,255,0.1); border-radius:4px; flex:1; }
.bar-fill { height:100%; background:linear-gradient(90deg, #0050c8, #00a8ff); border-radius:4px; width:95%; }
.price-section { display:flex; gap:14px; }
.price-card { flex:1; background:rgba(0,168,255,0.08); border:1px solid rgba(0,168,255,0.3); border-radius:14px; padding:14px; }
.price-cap { font-size:12px; color:rgba(255,255,255,0.5); margin-bottom:4px; }
.price-val { font-size:24px; font-weight:900; color:#00a8ff; }
.price-sub { font-size:12px; color:rgba(255,255,255,0.4); }
.visual { width:280px; display:flex; flex-direction:column; align-items:center; gap:16px; }
.ssd-vis { width:220px; height:120px; background:linear-gradient(135deg, rgba(0,80,200,0.2), rgba(0,168,255,0.1)); border:1px solid rgba(0,168,255,0.3); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:60px; }
.specs { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.spec-tag { background:rgba(0,168,255,0.1); border:1px solid rgba(0,168,255,0.3); color:#00a8ff; font-size:12px; font-weight:700; padding:5px 10px; border-radius:8px; }
.reason { font-size:13px; color:rgba(255,255,255,0.5); text-align:center; line-height:1.5; }
.footer { display:flex; justify-content:space-between; align-items:center; }
.contact { color:rgba(255,255,255,0.6); font-size:14px; line-height:1.9; }
.contact strong { color:#00a8ff; }
.tags { color:rgba(0,168,255,0.4); font-size:12px; text-align:right; line-height:2; }
</style>
</head>
<body>
<div class="bg">
  <div class="speed-lines"></div>
  <div class="glow"></div>
  <div class="content">
    <div class="header">
      <div class="logo-badge">PC SHOP</div>
      <div class="cat-badge">⚡ 電腦升級</div>
    </div>
    <div class="main">
      <div class="text-side">
        <div class="brand-row">
          <span class="samsung-tag">SAMSUNG</span>
          <span class="gen5-tag">PCIe 5.0 Gen.5</span>
        </div>
        <div class="headline">速度<span>極限</span><br>9100 PRO SSD</div>
        <div class="subtitle">電腦慢？換 SSD 係最快見效的升級！</div>
        <div class="speed-bar">
          <div class="speed-label">循序讀取速度</div>
          <div class="speed-value">
            <span class="speed-num">14,800</span>
            <span class="speed-unit">MB/s</span>
            <div class="bar-track"><div class="bar-fill"></div></div>
          </div>
        </div>
        <div class="price-section">
          <div class="price-card">
            <div class="price-cap">9100 PRO 1TB</div>
            <div class="price-val">HK$2,220</div>
            <div class="price-sub">PCIe 5.0 · M.2</div>
          </div>
          <div class="price-card">
            <div class="price-cap">990 PRO 1TB</div>
            <div class="price-val">HK$568</div>
            <div class="price-sub">PCIe 4.0 · 超高性價比</div>
          </div>
        </div>
      </div>
      <div class="visual">
        <div class="ssd-vis">💾</div>
        <div class="specs">
          <span class="spec-tag">M.2 NVMe</span>
          <span class="spec-tag">Gen.5</span>
          <span class="spec-tag">3年保養</span>
          <span class="spec-tag">即插即用</span>
        </div>
        <div class="reason">開機超快 · 遊戲即開<br>剪片輸出快到飛起</div>
      </div>
    </div>
    <div class="footer">
      <div class="contact">
        <strong>🌐 pcshop-net.com</strong><br>
        📞 2840 3503　📍 澳門 PC Shop 專業電腦店
      </div>
      <div class="tags">
        #Samsung #SSD #PCIe5<br>#電腦升級 #澳門電腦
      </div>
    </div>
  </div>
</div>
</body>
</html>
